name: CI/CD Pipeline
#on: [push, pull_request]
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, linux, docker, shared]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:  
           node-version: '20' 
      - run: npm install dependencies
      - run: npm install
#      - run: npm test
      - run: npm run lint --if-present
